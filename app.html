<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دانشیار</title>
  <style>
    :root{
      --primary:#4f46e5;
      --primary-light:#eef2ff;
      --bg:#f8fafc;
      --text:#1e293b;
      --muted:#64748b;
      --card:#ffffff;
      --border:#e2e8f0;
      --wiki:#0284c7;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body{ margin:0; padding:12px; font-family:Tahoma, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); }
    .container{ max-width:680px; margin:auto; background:var(--card); border-radius:14px; padding:14px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
    h1{ margin:0 0 10px; text-align:center; color:var(--primary); font-size:20px; font-weight:bold; }

    /* تب‌های موضوعی */
    .filters{
      display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{ display:none; }
    .chip{
      padding:6px 12px; border-radius:20px; border:1px solid #cbd5e1;
      background:#fff; cursor:pointer; white-space:nowrap; font-size:13px;
      color:var(--text); transition:all .2s ease;
    }
    .chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; font-weight:bold; }

    .wiki-bar-row{ display:flex; justify-content:center; padding:4px 0 10px; border-bottom:1px solid var(--border); }
    .wiki-standalone-chip{
      display:flex; align-items:center; justify-content:center; gap:6px;
      width:100%; max-width:210px; padding:6px 14px; border-radius:20px;
      border:1.5px solid var(--wiki); background:#fff; color:var(--wiki);
      font-size:13px; font-weight:bold; cursor:pointer;
    }
    .wiki-standalone-chip.active{ background:var(--wiki); color:#fff; }

    /* کادر ورودی */
    .inputs-row{ display:flex; gap:8px; margin-top:12px; }
    .search-wrap{ position:relative; flex:1; }
    input[type="text"]{
      width:100%; padding:10px 32px 10px 12px; border:1px solid #cbd5e1;
      border-radius:8px; font-size:14.5px; outline:none; background:#fff;
    }
    input[type="text"]:focus{ border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light); }
    
    .clear-btn{
      position:absolute; left:8px; top:50%; transform:translateY(-50%);
      background:none; border:none; font-size:16px; color:#94a3b8;
      cursor:pointer; display:none; padding:4px;
    }

    input[type="number"]{
      width:75px; padding:10px 4px; border:1px solid #cbd5e1; border-radius:8px;
      font-size:14px; outline:none; text-align:center;
    }

    .search-btn{
      width:100%; margin:8px 0 12px; padding:10px;
      border:none; border-radius:8px; background:var(--primary);
      color:#fff; font-size:15px; cursor:pointer; font-weight:bold;
    }

    /* جدول نتایج */
    .table-container{ width:100%; overflow-x:auto; }
    table.result-table{
      width:100%; border-collapse:collapse; text-align:right; font-size:13.5px;
    }
    table.result-table th, table.result-table td{
      padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;
    }
    table.result-table th{
      background:#f1f5f9; color:#475569; font-weight:bold; font-size:13px;
    }
    .col-num{ width:50px; text-align:center; color:var(--muted); font-weight:bold; }
    .col-title{ width:auto; }
    
    .book-name{ font-weight:bold; color:var(--primary); font-size:14.5px; display:inline-block; margin-bottom:2px; }
    .book-desc{ color:#475569; font-size:12.5px; line-height:1.5; }
    .badge-len{ font-size:11px; background:#f1f5f9; color:var(--muted); padding:1px 5px; border-radius:4px; margin-right:4px; }
    .hl{ background:#fef08a; font-weight:bold; padding:0 2px; border-radius:2px; }
    
    .empty{ padding:20px 0; color:var(--muted); text-align:center; font-size:13.5px; }

    .toast{
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      background:#0f172a; color:#fff; padding:7px 16px; border-radius:20px;
      font-size:12.5px; display:none; z-index:9999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>دانشیار</h1>

    <!-- ردیف اول: تب‌های موضوعی -->
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">همه</button>
      <button class="chip" data-filter="ادبیات">ادبیات</button>
      <button class="chip" data-filter="مشاهیر">مشاهیر</button>
      <button class="chip" data-filter="اساطیر">اساطیر</button>
      <button class="chip" data-filter="فلسفه">فلسفه</button>
      <button class="chip" data-filter="جغرافیا">جغرافیا</button>
      <button class="chip" data-filter="تاریخ">تاریخ</button>
      <button class="chip" data-filter="پزشکی">پزشکی</button>
      <button class="chip" data-filter="هنر">هنر</button>
      <button class="chip" data-filter="ورزش">ورزش</button>
      <button class="chip" data-filter="گیاهان">گیاهان</button>
      <button class="chip" data-filter="جانوران">جانوران</button>
      <button class="chip" data-filter="غذا">غذا</button>
      <button class="chip" data-filter="نوبل">نوبل</button>
    </div>

    <!-- تب دانشنامه ویکی‌پدیا -->
    <div class="wiki-bar-row">
      <button class="wiki-standalone-chip" id="wikiTabBtn" data-filter="wikipedia">
        🌐 جستجو در دانشنامه ویکی‌پدیا
      </button>
    </div>

    <!-- کادرهای جستجو (بدون هیچ متن پیش‌فرض) -->
    <div class="inputs-row">
      <div class="search-wrap">
        <input id="searchInput" type="text" autocomplete="off" />
        <button id="clearBtn" class="clear-btn" title="حذف">✕</button>
      </div>
      <input id="lenInput" type="number" min="1" max="30" title="تعداد حروف" />
    </div>

    <button class="search-btn" id="searchBtn">جستجو</button>

    <!-- جدول خروجی نتایج -->
    <div class="table-container" id="results"></div>
  </div>

  <div id="toast" class="toast">کپی شد!</div>

  <!-- بارگذاری فایل‌های دیتابیس -->
  <script src="data1.js"></script>
  <script src="geo_data.js"></script>
  <script src="data_fi.js"></script>
  <script src="data_sp.js"></script>
  <script src="data_pa.js"></script>
  <script src="data_mp.js"></script>
  <script src="data_f.js"></script>
  <script src="data_nobel.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { filter: "all" };
    let MASTER_DATA = [];

    function initData() {
      MASTER_DATA = [];
      if (Array.isArray(window.CROSSWORD_DATA)) MASTER_DATA.push(...window.CROSSWORD_DATA);
      if (Array.isArray(window.GEO_DATA)) MASTER_DATA.push(...window.GEO_DATA);
      if (Array.isArray(window.NOBEL_DATA)) MASTER_DATA.push(...window.NOBEL_DATA);
      if (Array.isArray(window.SPORTS_DATA)) MASTER_DATA.push(...window.SPORTS_DATA);

      if (typeof figuresData !== "undefined" && Array.isArray(figuresData)) {
        figuresData.forEach(item => {
          const details = [];
          if (item.role) details.push(item.role);
          if (item.nationality) details.push(`ملیت: ${item.nationality}`);
          if (item.era) details.push(`دوره: ${item.era}`);
          if (item.works && item.works.length) details.push(`آثار: ${item.works.join("، ")}`);
          MASTER_DATA.push({
            a: item.name,
            c: details.join(" | "),
            cat: item.category || "مشاهیر"
          });
        });
      }
    }

    function norm(s){
      return (s || "")
        .toString()
        .trim()
        .toLowerCase()
        .replace(/ي/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/[آأإ]/g,"ا")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/ئ/g,"ی")
        .replace(/[\u200c\u200b\u200e\u200f]/g, "")
        .replace(/[\u064B-\u065F]/g, "");
    }

    function getWordLength(str){
      return (str || "").toString().replace(/[\s\u200c]+/g, "").length;
    }

    function matchesFilter(item, filter){
      if(filter === "all" || filter === "wikipedia") return true;
      const cat = norm(item.cat);
      const clue = norm(item.c);
      const f = norm(filter);

      if (f === "پزشکی" && (cat.includes("دارو") || clue.includes("دارو"))) return true;
      if (f === "ادبیات" && (cat.includes("شعر") || cat.includes("شاعر") || clue.includes("شاعر") || cat.includes("کتاب"))) return true;
      if (f === "ورزش" && (cat.includes("فوتبال") || clue.includes("ورزش"))) return true;

      return cat.includes(f) || clue.includes(f);
    }

    function matchesLength(item, targetLen){
      if(!targetLen || isNaN(targetLen) || targetLen <= 0) return true;
      return getWordLength(item.a) === targetLen;
    }

    function evaluateMatch(item, rawQuery){
      if (!rawQuery) return { matched: true, score: 0 };

      const cleanQ = norm(rawQuery);
      const cleanA = norm(item.a);
      const cleanC = norm(item.c);
      const cleanCat = norm(item.cat);

      if (/[\.\?\*]/.test(rawQuery)) {
        const patternStr = "^" + cleanQ.replace(/[\.\?\*]/g, "[\\w\\u0600-\\u06FF]") + "$";
        try {
          const reg = new RegExp(patternStr);
          if (reg.test(cleanA.replace(/\s+/g, ""))) return { matched: true, score: 100 };
        } catch(e){}
      }

      const words = cleanQ.split(/\s+/).filter(w => w.length > 0);
      let score = 0;
      let allFound = true;

      for (const w of words) {
        let found = false;
        if (cleanA.includes(w)) {
          found = true;
          score += (cleanA === w) ? 40 : 20;
        }
        if (cleanC.includes(w)) {
          found = true;
          score += 10;
        }
        if (cleanCat.includes(w)) {
          found = true;
          score += 3;
        }
        if (!found) { allFound = false; break; }
      }
      return { matched: allFound, score };
    }

    function highlight(text, q) {
      if (!q || !text) return text || "";
      const words = norm(q).split(/\s+/).filter(w => w.length > 1 && !/[\.\?\*]/.test(w));
      if (!words.length) return text;
      let res = text.toString();
      words.forEach(w => {
        const reg = new RegExp(`(${w})`, "gi");
        res = res.replace(reg, '<span class="hl">$1</span>');
      });
      return res;
    }

    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 1500);
    }

    window.copyWord = function(word) {
      if(navigator.clipboard) {
        navigator.clipboard.writeText(word).then(() => showToast(`کپی شد: ${word}`));
      } else {
        showToast(`پاسخ: ${word}`);
      }
    };

    window.openWiki = function(term) {
      const clean = term.replace(/["'«»]/g, "").trim();
      window.open(`https://fa.wikipedia.org/wiki/${encodeURIComponent(clean)}`, '_blank');
    };

    async function searchWikipediaLive(query) {
      const root = $("results");
      if (!query) {
        root.innerHTML = `<div class="empty">عبارتی را در کادر بالا بنویسید.</div>`;
        return;
      }
      root.innerHTML = `<div class="empty">در حال جستجو در دانشنامه...</div>`;
      
      try {
        const res = await fetch(`https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
        const data = await res.json();
        const items = data.query ? data.query.search : [];

        if (!items.length) {
          root.innerHTML = `<div class="empty">موردی یافت نشد.</div>`;
          return;
        }

        let html = `
          <table class="result-table">
            <thead>
              <tr>
                <th class="col-num">ردیف</th>
                <th class="col-title">نام کتاب / مدخل</th>
              </tr>
            </thead>
            <tbody>
        `;

        items.forEach((it, idx) => {
          html += `
            <tr onclick="openWiki('${it.title}')" style="cursor:pointer;">
              <td class="col-num">${idx + 1}</td>
              <td class="col-title">
                <span class="book-name" style="color:var(--wiki);">${it.title}</span>
                <div class="book-desc">${it.snippet.replace(/<span class="searchmatch">/g, '<span class="hl">').replace(/<\/span>/g, '</span>')}...</div>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        root.innerHTML = html;
      } catch (e) {
        root.innerHTML = `<div class="empty">خطا در برقراری ارتباط با اینترنت.</div>`;
      }
    }

    function render(list, q){
      const root = $("results");
      
      if(list.length === 0){
        root.innerHTML = `<div class="empty">نتیجه‌ای پیدا نشد.</div>`;
        return;
      }

      let html = `
        <table class="result-table">
          <thead>
            <tr>
              <th class="col-num">ردیف</th>
              <th class="col-title">نام کتاب</th>
            </tr>
          </thead>
          <tbody>
      `;

      list.slice(0, 150).forEach((item, index) => {
        const len = getWordLength(item.a);
        const ansHl = highlight(item.a, q);
        const clueHl = highlight(item.c, q);
        const safeWord = (item.a || "").replace(/'/g, "\\'");

        html += `
          <tr onclick="copyWord('${safeWord}')" style="cursor:pointer;">
            <td class="col-num">${index + 1}</td>
            <td class="col-title">
              <span class="book-name">${ansHl}</span>
              <span class="badge-len">${len}حرف</span>
              ${item.c ? `<div class="book-desc">${clueHl}</div>` : ''}
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      root.innerHTML = html;
    }

    function doSearch(){
      const rawQ = $("searchInput").value.trim();

      if (state.filter === "wikipedia") {
        searchWikipediaLive(rawQ);
        return;
      }

      const targetLen = parseInt($("lenInput").value, 10);
      const scoredResults = [];

      for (let i = 0; i < MASTER_DATA.length; i++) {
        const it = MASTER_DATA[i];
        if (!it) continue;

        if (!matchesFilter(it, state.filter)) continue;
        if (!matchesLength(it, targetLen)) continue;

        const evalRes = evaluateMatch(it, rawQ);
        if (evalRes.matched) {
          scoredResults.push({ item: it, score: evalRes.score });
        }
      }

      scoredResults.sort((a, b) => b.score - a.score);
      render(scoredResults.map(r => r.item), rawQ);
    }

    const searchInput = $("searchInput");
    const clearBtn = $("clearBtn");

    function checkClearBtn(){
      clearBtn.style.display = searchInput.value ? "block" : "none";
    }

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      checkClearBtn();
      searchInput.focus();
      doSearch();
    });

    let timeoutId = null;
    function debouncedSearch(){
      checkClearBtn();
      clearTimeout(timeoutId);
      timeoutId = setTimeout(doSearch, 180);
    }

    $("searchBtn").addEventListener("click", doSearch);
    searchInput.addEventListener("input", debouncedSearch);
    $("lenInput").addEventListener("input", debouncedSearch);
    searchInput.addEventListener("keydown", (e) => { if(e.key === "Enter") doSearch(); });

    $("filters").addEventListener("click", (e)=>{
      const btn = e.target.closest("button[data-filter]");
      if(!btn) return;
      state.filter = btn.dataset.filter;

      document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
      $("wikiTabBtn").classList.remove("active");
      btn.classList.add("active");

      doSearch();
    });

    $("wikiTabBtn").addEventListener("click", () => {
      state.filter = "wikipedia";
      document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
      $("wikiTabBtn").classList.add("active");
      doSearch();
    });

    window.addEventListener("DOMContentLoaded", () => {
      initData();
      searchInput.value = "";
      checkClearBtn();
      doSearch();
    });
  </script>
</body>
</html>
