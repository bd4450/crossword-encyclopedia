<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانشنامه جدولی</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f4f6f9;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin-top: 15px;
    }
    .app-title {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 14px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      background: #fff;
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    #searchInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid transparent;
      outline: none;
      border-radius: 8px;
    }
    #searchBtn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: #3498db;
    }
    .results-area {
      margin-top: 18px;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      min-height: 100px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      font-size: .95rem;
      line-height: 1.6;
      color: #555;
    }
    .result-item {
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #f8fafc;
      border-right: 4px solid #3498db;
      border-radius: 6px;
    }
    .result-title {
      font-weight: bold;
      color: #1e293b;
      font-size: 1rem;
    }
    .result-meta {
      font-size: .8rem;
      color: #64748b;
    }
    .result-desc {
      color: #475569;
      font-size: .9rem;
      margin-top: 4px;
    }
    .result-count {
      font-size: .85rem;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .status {
      text-align: center;
      color: #64748b;
      font-size: .9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-title">📖 دانشنامه جدولی</div>

    <div class="search-box">
      <input id="searchInput" type="search" placeholder="سرنخ، کلمه یا الگو مثل: م _ ر _" autocomplete="off">
      <button id="searchBtn" type="button">جستجو</button>
    </div>

    <div class="results-area" id="resultsArea">
      <div class="status">در حال بارگذاری بانک داده...</div>
    </div>
  </div>

  <!-- فراخوانی فایل بانک داده -->
  <script src="data1.js"></script>

  <!-- موتور جستجو و منطق برنامه -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('searchInput');
      const btn = document.getElementById('searchBtn');
      const results = document.getElementById('resultsArea');

      const MAX_SHOW = 100;

      function normalize(text) {
        if (!text) return '';
        return String(text).trim().toLowerCase()
          .replace(/[\u064B-\u065F\u0670]/g, '') // حذف اعراب و تنوین
          .replace(/[يى]/g, 'ی')
          .replace(/ك/g, 'ک')
          .replace(/آ/g, 'ا')
          .replace(/[\s\u200C]+/g, ' '); // یکدست‌سازی فاصله و نیم‌فاصله
      }

      const rawData = window.CROSSWORD_DATA || [];
      const data = rawData.map(item => {
        const word = normalize(item.a || '');
        return {
          a: item.a,
          c: item.c || '',
          cat: item.cat || '',
          w: word,
          cl: normalize(item.c),
          len: word.replace(/\s/g, '').length
        };
      });

      if (data.length === 0) {
        results.innerHTML = '<div class="status">⚠️ فایل data1.js بارگذاری نشد یا خالی است. مطمئن شوید هر دو فایل در یک پوشه هستند.</div>';
      } else {
        results.innerHTML = `<div class="status">✅ بانک داده آماده است — ${data.length.toLocaleString('fa-IR')} مدخل فعال.</div>`;
      }

      function handleSearch() {
        const raw = input.value.trim();
        if (!raw) {
          results.innerHTML = '<span style="color:#e74c3c;">لطفاً کلمه، سرنخ یا الگوی موردنظر را بنویسید.</span>';
          return;
        }

        const q = normalize(raw);

        // ۱. جستجوی تعداد حروف مثل: #5
        if (/^#\d+$/.test(q)) {
          const n = parseInt(q.slice(1), 10);
          const matches = data.filter(item => item.len === n);
          render(matches, `کلمات ${n} حرفی`);
          return;
        }

        // ۲. جستجوی الگویی مثل: م _ ر _ یا د*د
        if (/[_*]/.test(q)) {
          const pattern = q.replace(/\s/g, '')
            .replace(/[_؟?]/g, '.')
            .replace(/\*/g, '.*');
          let re;
          try {
            re = new RegExp('^' + pattern + '$');
          } catch (e) {
            results.innerHTML = '<span style="color:#e74c3c;">فرمت الگو معتبر نیست.</span>';
            return;
          }
          const matches = data.filter(item => re.test(item.w.replace(/\s/g, '')));
          render(matches, `الگوی «${raw}»`);
          return;
        }

        // ۳. جستجوی عادی در سرنخ و پاسخ
        const matches = data.filter(item => item.w.includes(q) || item.cl.includes(q));
        render(matches, `جستجوی «${raw}»`);
      }

      function render(matches, label) {
        if (matches.length === 0) {
          results.innerHTML = `<span style="color:#7f8c8d;">موردی برای ${label} پیدا نشد.</span>`;
          return;
        }

        let html = `<div class="result-count">${label}: ${matches.length.toLocaleString('fa-IR')} مورد یافت شد` +
          (matches.length > MAX_SHOW ? ` (نمایش ${MAX_SHOW.toLocaleString('fa-IR')} مورد اول)` : '') + `</div>`;

        const limit = Math.min(matches.length, MAX_SHOW);
        for (let i = 0; i < limit; i++) {
          const m = matches[i];
          html += `
            <div class="result-item">
              <span class="result-title">${m.a}</span>
              <span class="result-meta">(${m.len} حرف${m.cat ? ' — ' + m.cat : ''})</span>
              <div class="result-desc">${m.c}</div>
            </div>
          `;
        }
        results.innerHTML = html;
      }

      btn.addEventListener('click', handleSearch);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSearch();
        }
      });
    });
  </script>
</body>
</html>
