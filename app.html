<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <style>
    :root{
      --primary:#7c3aed;
      --bg:#f8fafc;
      --green:#16a34a;
      --text:#0f172a;
      --muted:#64748b;
      --card:#ffffff;
      --border:#e5e7eb;
    }
    body{ margin:0; padding:14px; font-family:Tahoma, sans-serif; background:var(--bg); color:var(--text); }
    .container{ max-width:720px; margin:auto; background:var(--card); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    h1{ margin:0 0 10px; text-align:center; color:var(--primary); font-size:22px; }

    .filters{ display:flex; gap:6px; overflow-x:auto; padding:10px 0; border-bottom:1px solid var(--border); -webkit-overflow-scrolling:touch; }
    .chip{
      padding:6px 14px; border-radius:999px; border:1px solid #d1d5db;
      background:#fff; cursor:pointer; white-space:nowrap; font-size:14px;
    }
    .chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

    .row{ display:flex; gap:8px; margin:12px 0; }
    input[type="text"]{
      flex:1; padding:12px; border:1px solid #cbd5e1; border-radius:10px;
      font-size:16px; box-sizing:border-box; outline:none;
    }
    input[type="number"]{
      width:78px; padding:12px 6px; border:1px solid #cbd5e1; border-radius:10px;
      font-size:15px; box-sizing:border-box; outline:none; text-align:center;
    }
    input:focus{ border-color:var(--primary); }

    .search-btn{
      padding:12px 16px; border:none; border-radius:10px; background:var(--green);
      color:#fff; font-size:16px; cursor:pointer; font-weight:bold; white-space:nowrap;
    }
    .search-btn:active{ opacity:.85; }

    .meta{ font-size:13px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .card{ padding:12px 0; border-bottom:1px solid var(--border); }
    .ans-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .ans{ font-weight:bold; color:var(--primary); font-size:17px; }
    .letter-badge{ font-size:12px; color:var(--muted); background:#f1f5f9; padding:2px 8px; border-radius:8px; }
    .clue{ color:var(--text); font-size:14px; line-height:1.6; }
    .tag{ color:var(--muted); font-size:12px; margin-top:6px; }
    .empty{ padding:14px 0; color:var(--muted); text-align:center; }
  </style>
</head>

    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">همه</button>

      <button class="chip" data-filter="اساطیر">اساطیر و ایزدان</button>
      <button class="chip" data-filter="فلسفه">فلسفه</button>
      <button class="chip" data-filter="ادبیات">ادبیات</button>
      <button class="chip" data-filter="جغرافیا">جغرافیا</button>
      <button class="chip" data-filter="تاریخ">تاریخ</button>
      <button class="chip" data-filter="پزشکی">پزشکی</button>
      <button class="chip" data-filter="هنر">هنر</button>
      <button class="chip" data-filter="ورزش">ورزش</button>
      <button class="chip" data-filter="گیاهان">گیاهان</button>
      <button class="chip" data-filter="جانوران">جانوران</button>
      <button class="chip" data-filter="دارویی">دارویی</button>
      <button class="chip" data-filter="غذا">غذا</button>
      <button class="chip" data-filter="نوبل">نوبل</button>
    </div>

    <div class="row">
      <input id="searchInput" type="text" placeholder="جستجو (مثلاً: کوروش، سقراط، زئوس، آویشن...)" autocomplete="off" />
      <input id="lenInput" type="number" placeholder="حروف" min="1" max="30" title="فیلتر تعداد حروف کلمه" />
      <button class="search-btn" id="searchBtn">جستجو</button>
    </div>

    <div class="meta">
      <div>تعداد کل داده‌ها: <span id="totalCount">0</span></div>
      <div>نتایج یافت‌شده: <span id="resultCount">0</span></div>
    </div>

    <div id="results"></div>
  </div>
