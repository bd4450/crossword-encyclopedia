<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دانشیار - حل جدول کلمات</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --highlight: #f59e0b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .search-card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .pattern-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .filters {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-item {
      flex: 1;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .result-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s, border-color 0.1s;
    }

    .result-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .word-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .word-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .word-len {
      font-size: 0.75rem;
      background: #0b1120;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .word-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
    }

    /* Collapsible Literature Section */
    .works-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .works-toggle-btn {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--accent);
      text-decoration: underline;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      outline: none;
      transition: color 0.2s, background-color 0.2s;
    }

    .works-toggle-btn:hover,
    .works-toggle-btn:focus-visible {
      color: var(--accent-hover);
      background-color: rgba(56, 189, 248, 0.08);
    }

    .works-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .works-toolbar {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .works-search-wrapper {
      flex: 1;
      min-width: 200px;
    }

    .works-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .works-table-container {
      overflow-x: auto;
      max-height: 480px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .works-table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
      font-size: 0.95rem;
    }

    .works-table th,
    .works-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .works-table th {
      background-color: #0b1120;
      color: var(--accent);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .works-table tbody tr:hover {
      background-color: rgba(56, 189, 248, 0.04);
    }

    .works-table tbody tr:last-child td {
      border-bottom: none;
    }

    .col-idx { width: 60px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
    .col-title { font-weight: 600; color: var(--text-main); }
    .col-author { color: var(--text-main); }
    .col-nationality { color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>دانشیار</h1>
      <p class="subtitle">یافتن واژه‌ها و پاسخ‌های معما بر اساس الگو و تعداد حروف</p>
    </header>

    <div class="search-card">
      <div class="input-group">
        <label for="patternInput">الگوی کلمه (از نقطه . یا فاصله برای حروف نامشخص استفاده کنید):</label>
        <div class="pattern-wrapper">
          <input 
            type="text" 
            id="patternInput" 
            placeholder="مثال: س..ور (۵ حرف) یا ر..مان" 
            autocomplete="off" 
            spellcheck="false"
          />
        </div>
        <div class="hint">حروف مشخص را بنویسید و به جای خانه‌های خالی نقطه یا فاصله بگذارید.</div>
      </div>

      <div class="filters">
        <div class="filter-item">
          <label for="lengthSelect">طول کلمه:</label>
          <select id="lengthSelect">
            <option value="any">هر طولی</option>
            <option value="2">۲ حرفی</option>
            <option value="3">۳ حرفی</option>
            <option value="4">۴ حرفی</option>
            <option value="5">۵ حرفی</option>
            <option value="6">۶ حرفی</option>
            <option value="7">۷ حرفی</option>
            <option value="8">۸ حرفی</option>
            <option value="9">۹+ حرفی</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="categorySelect">دسته‌بندی (اختیاری):</label>
          <select id="categorySelect">
            <option value="all">همه دسته‌ها</option>
          </select>
        </div>
      </div>

      <!-- Collapsible Literature Section -->
      <div class="works-section">
        <button 
          type="button" 
          id="worksToggleBtn" 
          class="works-toggle-btn" 
          aria-expanded="false" 
          aria-controls="worksPanel"
        >
          فهرست آثار مشهور جهان
        </button>

        <div id="worksPanel" class="works-panel" hidden>
          <div class="works-toolbar">
            <div class="works-search-wrapper">
              <input 
                type="text" 
                id="worksSearchInput" 
                placeholder="جستجو در آثار، نویسندگان یا ملیت‌ها..." 
                autocomplete="off" 
                spellcheck="false"
              />
            </div>
            <div id="worksCount" class="works-counter">تعداد نمایش: ۰</div>
          </div>

          <div class="works-table-container">
            <table class="works-table">
              <thead>
                <tr>
                  <th class="col-idx">ردیف</th>
                  <th class="col-title">اثر</th>
                  <th class="col-author">نویسنده</th>
                  <th class="col-nationality">ملیت نویسنده</th>
                </tr>
              </thead>
              <tbody id="worksTableBody">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="stats">
        <span id="matchCount">در حال آماده‌سازی داده‌ها...</span>
        <span id="loadStatus" class="badge">بارگذاری دیتابیس</span>
      </div>
    </div>

    <div class="results-container" id="resultsContainer">
      <!-- نتایج جستجو در اینجا نمایش داده می‌شوند -->
    </div>
  </div>

  <script src="data1.js"></script>
  <script>
    // Standard Persian Normalization
    function norm(text) {
      if (!text) return "";
      return String(text)
        .replace(/[\u200B-\u200D\uFEFF]/g, "") // نیم‌فاصله و کاراکترهای مخفی
        .replace(/[يی]/g, "ی")
        .replace(/[كک]/g, "ک")
        .replace(/[آاإأ]/g, "ا")
        .replace(/[ة]/g, "ه")
        .replace(/[\u064B-\u065F]/g, "") // اعراب
        .trim();
    }

    let database = [];

    // Fallback minimal mock dataset
    const mockData = [
      { w: "سنتور", d: "از سازهای زهی موسیقی سنتی ایران", c: "موسیقی" },
      { w: "سنتور", d: "جعبه‌ای صوتی به شکل ذوزنقه با سیم‌های فراوان", c: "ساز" },
      { w: "تنبور", d: "ساز زهی با دسته بلند و کاسه گلابی‌شکل", c: "موسیقی" },
      { w: "سه تار", d: "از سازهای زهی مضرابی ایران", c: "موسیقی" },
      { w: "رستم", d: "بزرگ‌ترین پهلوان شاهنامه فردوسی", c: "ادبیات" },
      { w: "سهراب", d: "فرزند رستم و تهمینه", c: "ادبیات" },
      { w: "افلاطون", d: "فیلسوف نامدار یونان باستان", c: "فلسفه" },
      { w: "سقراط", d: "فیلسوف بزرگ یونانی و آموزگار افلاطون", c: "فلسفه" },
      { w: "ارسطو", d: "فیلسوف برجسته و شاگرد افلاطون", c: "فلسفه" },
      { w: "دماوند", d: "بلندترین کوه ایران و آتشفشان نیمه‌فعال", c: "جغرافیا" },
      { w: "سهند", d: "از کوه‌های مهم استان آذربایجان شرقی", c: "جغرافیا" },
      { w: "زاگرس", d: "رشته‌کوهی پهناور در غرب و جنوب ایران", c: "جغرافیا" }
    ];

    // Data init
    function initDatabase() {
      if (typeof window.wordsData !== 'undefined' && Array.isArray(window.wordsData)) {
        database = window.wordsData;
        document.getElementById('loadStatus').textContent = `بانک جامع (${database.length.toLocaleString('fa-IR')} لغت)`;
      } else {
        database = mockData;
        document.getElementById('loadStatus').textContent = `حالت سبک (${database.length} لغت نمونه)`;
      }
      populateCategories();
      executeSearch();
    }

    function populateCategories() {
      const catSelect = document.getElementById('categorySelect');
      const cats = new Set();
      database.forEach(item => {
        if (item.c) cats.add(item.c);
      });

      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });
    }

    function compilePatternRegex(rawPattern) {
      if (!rawPattern) return null;
      let clean = norm(rawPattern).replace(/\s+/g, '.');
      let regexStr = "^";
      for (let char of clean) {
        if (char === '.') {
          regexStr += "[\\u0600-\\u06FFa-zA-Z]";
        } else {
          regexStr += char;
        }
      }
      regexStr += "$";
      return new RegExp(regexStr);
    }

    function executeSearch() {
      const patternVal = document.getElementById('patternInput').value.trim();
      const lengthVal = document.getElementById('lengthSelect').value;
      const catVal = document.getElementById('categorySelect').value;

      const normPattern = norm(patternVal);
      const isPatternFilled = normPattern.length > 0;
      const patternRegex = isPatternFilled ? compilePatternRegex(patternVal) : null;
      const targetLength = isPatternFilled ? normPattern.length : (lengthVal !== 'any' ? parseInt(lengthVal, 10) : null);

      const matches = database.filter(item => {
        const cleanWord = norm(item.w);

        // Length Check
        if (lengthVal !== 'any') {
          const l = parseInt(lengthVal, 10);
          if (l === 9 && cleanWord.length < 9) return false;
          if (l !== 9 && cleanWord.length !== l) return false;
        } else if (isPatternFilled && cleanWord.length !== targetLength) {
          return false;
        }

        // Category Check
        if (catVal !== 'all' && item.c !== catVal) {
          return false;
        }

        // Pattern Check
        if (patternRegex && !patternRegex.test(cleanWord)) {
          return false;
        }

        return true;
      });

      renderResults(matches);
    }

    function renderResults(results) {
      const container = document.getElementById('resultsContainer');
      const counter = document.getElementById('matchCount');
      container.innerHTML = '';

      counter.textContent = `${results.length.toLocaleString('fa-IR')} مورد یافت شد`;

      if (results.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>هیچ پاسخی مطابق با الگوی جستجوی شما پیدا نشد.</p>
            <p style="margin-top: 0.5rem; font-size: 0.85rem;">نکته: تعداد حروف یا جای خالی را مجدداً بررسی نمایید.</p>
          </div>
        `;
        return;
      }

      const limit = Math.min(results.length, 100);
      const frag = document.createDocumentFragment();

      for (let i = 0; i < limit; i++) {
        const item = results[i];
        const card = document.createElement('div');
        card.className = 'result-card';

        card.innerHTML = `
          <div class="word-info">
            <div class="word-title">
              <span>${item.w}</span>
              <span class="word-len">${norm(item.w).length} حرف</span>
            </div>
            <div class="word-desc">${item.d || 'توضیحی ثبت نشده است.'}</div>
          </div>
          ${item.c ? `<span class="badge">${item.c}</span>` : ''}
        `;
        frag.appendChild(card);
      }

      container.appendChild(frag);

      if (results.length > 100) {
        const moreInfo = document.createElement('div');
        moreInfo.style.textAlign = 'center';
        moreInfo.style.color = 'var(--text-muted)';
        moreInfo.style.fontSize = '0.85rem';
        moreInfo.style.padding = '1rem';
        moreInfo.textContent = `نمایش ۱۰۰ مورد نخست از ${results.length.toLocaleString('fa-IR')} نتیجه. لطفاً الگو را دقیق‌تر وارد کنید.`;
        container.appendChild(moreInfo);
      }
    }

    // Attach Listeners
    document.getElementById('patternInput').addEventListener('input', executeSearch);
    document.getElementById('lengthSelect').addEventListener('change', executeSearch);
    document.getElementById('categorySelect').addEventListener('change', executeSearch);

    // Initial run
    window.addEventListener('DOMContentLoaded', initDatabase);

    // ==========================================
    // World Famous Literature Dataset & Logic
    // ==========================================
    window.WORLD_FAMOUS_LITERATURE = [
      { title: "آرزوهای بزرگ", author: "چارلز دیکنز", nationality: "انگلستان" },
      { title: "آنا کارنینا", author: "لئو تولستوی", nationality: "روسیه" },
      { title: "اتللو", author: "ویلیام شکسپیر", nationality: "انگلستان" },
      { title: "ارباب حلقه‌ها", author: "جی. آر. آر. تالکین", nationality: "انگلستان" },
      { title: "۱۹۸۴", author: "جورج اورول", nationality: "انگلستان" },
      { title: "بادبادک‌باز", author: "خالد حسینی", nationality: "افغانستان / آمریکا" },
      { title: "بار هستی", author: "میلان کوندرا", nationality: "چک / فرانسه" },
      { title: "بلندی‌های بادگیر", author: "امیلی برونته", nationality: "انگلستان" },
      { title: "بینوایان", author: "ویکتور هوگو", nationality: "فرانسه" },
      { title: "بیگانه", author: "آلبر کامو", nationality: "الجزایر / فرانسه" },
      { title: "پدرخوانده", author: "ماریو پوزو", nationality: "آمریکا" },
      { title: "پیرمرد و دریا", author: "ارنست همینگوی", nationality: "آمریکا" },
      { title: "تاجر ونیزی", author: "ویلیام شکسپیر", nationality: "انگلستان" },
      { title: "تام سایر", author: "مارک تواین", nationality: "آمریکا" },
      { title: "تصویر دوریان گری", author: "اسکار وایلد", nationality: "ایرلند" },
      { title: "تهوع", author: "ژان-پل سارتر", nationality: "فرانسه" },
      { title: "جنایت و مکافات", author: "فئودور داستایفسکی", nationality: "روسیه" },
      { title: "جنگ و صلح", author: "لئو تولستوی", nationality: "روسیه" },
      { title: "خوشه‌های خشم", author: "جان اشتاین‌بک", nationality: "آمریکا" },
      { title: "دایی وانیا", author: "آنتون چخوف", nationality: "روسیه" },
      { title: "در جستجوی زمان از دست رفته", author: "مارسل پروست", nationality: "فرانسه" },
      { title: "دکامرون", author: "جووانی بوکاچیو", nationality: "ایتالیا" },
      { title: "دکتر ژیواگو", author: "بوریس پاسترناک", nationality: "روسیه" },
      { title: "دن کیشوت", author: "میگل د سروانتس", nationality: "اسپانیا" },
      { title: "دنیای قشنگ نو", author: "آلدوس هاکسلی", nationality: "انگلستان" },
      { title: "دیوید کاپرفیلد", author: "چارلز دیکنز", nationality: "انگلستان" },
      { title: "رئیس‌جمهور", author: "میگل آنخل آستوریاس", nationality: "گواتمالا" },
      { title: "روباه", author: "دی. اچ. لارنس", nationality: "انگلستان" },
      { title: "رومئو و ژولیت", author: "ویلیام شکسپیر", nationality: "انگلستان" },
      { title: "زن در ریگ روان", author: "کوبو آبه", nationality: "ژاپن" },
      { title: "ژرمینال", author: "امیل زولا", nationality: "فرانسه" },
      { title: "سال کورمران", author: "ماریو بارگاس یوسا", nationality: "پرو" },
      { title: "سفر به انتهای شب", author: "لویی-فردینان سلین", nationality: "فرانسه" },
      { title: "سلوک سرخ‌پوست", author: "ویلیام فاکنر", nationality: "آمریکا" },
      { title: "سنت‌اگزوپری (شازده کوچولو)", author: "آنتوان دو سنت‌اگزوپری", nationality: "فرانسه" },
      { title: "سیاه‌مست", author: "جک لندن", nationality: "آمریکا" },
      { title: "صد سال تنهایی", author: "گابریل گارسیا مارکز", nationality: "کلمبیا" },
      { title: "طاعون", author: "آلبر کامو", nationality: "الجزایر / فرانسه" },
      { title: "غرور و تعصب", author: "جین آستین", nationality: "انگلستان" },
      { title: "فاوست", author: "یوهان ولفگانگ فون گوته", nationality: "آلمان" },
      { title: "قصر", author: "فرانتس کافکا", nationality: "اتریش / چک" },
      { title: "قلعه حیوانات", author: "جورج اورول", nationality: "انگلستان" },
      { title: "کمدی الهی", author: "دانته آلیگیری", nationality: "ایتالیا" },
      { title: "کوری", author: "ژوزه ساراماگو", nationality: "پرتغال" },
      { title: "گرگ بیابان", author: "هرمان هسه", nationality: "آلمان" },
      { title: "گتسبی بزرگ", author: "اف. اسکات فیتزجرالد", nationality: "آمریکا" },
      { title: "مادام بوواری", author: "گوستاو فلوبر", nationality: "فرانسه" },
      { title: "ماه پنهان است", author: "جان اشتاین‌بک", nationality: "آمریکا" },
      { title: "مرشد و مارگاریتا", author: "میخائیل بولگاکف", nationality: "روسیه" },
      { title: "مرگ ایوان ایلیچ", author: "لئو تولستوی", nationality: "روسیه" },
      { title: "مرگ در ونیز", author: "توماس مان", nationality: "آلمان" },
      { title: "مرگ فروشنده", author: "آرتور میلر", nationality: "آمریکا" },
      { title: "مزرعه حیوانات", author: "جورج اورول", nationality: "انگلستان" },
      { title: "مسخ", author: "فرانتس کافکا", nationality: "اتریش / چک" },
      { title: "موبی‌دیک", author: "هرمان ملویل", nationality: "آمریکا" },
      { title: "موج‌ها", author: "ویرجینیا وولف", nationality: "انگلستان" },
      { title: "نام گل سرخ", author: "اومبرتو اکو", nationality: "ایتالیا" },
      { title: "ناتور دشت", author: "جی. دی. سلینجر", nationality: "آمریکا" },
      { title: "وداع با اسلحه", author: "ارنست همینگوی", nationality: "آمریکا" },
      { title: "هاملت", author: "ویلیام شکسپیر", nationality: "انگلستان" },
      { title: "هاکلبری فین", author: "مارک تواین", nationality: "آمریکا" },
      { title: "هزارتوهای بورخس", author: "خورخه لوئیس بورخس", nationality: "آرژانتین" },
      { title: "یک روز از زندگی ایوان دنیسویچ", author: "الکساندر سولژنیتسین", nationality: "روسیه" },
      { title: "یولیسیز (اولیس)", author: "جیمز جویس", nationality: "ایرلند" },
      { title: "ایلیاد", author: "هومر", nationality: "یونان باستان" },
      { title: "ادیسه", author: "هومر", nationality: "یونان باستان" },
      { title: "کلبه عمو تام", author: "هریت بیچر استو", nationality: "آمریکا" },
      { title: "کنت مونت کریستو", author: "الکساندر دوما", nationality: "فرانسه" }
    ];

    // Sort literature list alphabetically by Persian title
    window.WORLD_FAMOUS_LITERATURE.sort((a, b) => norm(a.title).localeCompare(norm(b.title), 'fa'));

    const worksToggleBtn = document.getElementById('worksToggleBtn');
    const worksPanel = document.getElementById('worksPanel');
    const worksSearchInput = document.getElementById('worksSearchInput');
    const worksTableBody = document.getElementById('worksTableBody');
    const worksCount = document.getElementById('worksCount');

    function toggleWorksPanel() {
      const isExpanded = worksToggleBtn.getAttribute('aria-expanded') === 'true';
      worksToggleBtn.setAttribute('aria-expanded', !isExpanded);
      worksPanel.hidden = isExpanded;
      if (!isExpanded) {
        worksSearchInput.focus();
        renderWorksTable();
      }
    }

    worksToggleBtn.addEventListener('click', toggleWorksPanel);
    worksToggleBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleWorksPanel();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !worksPanel.hidden) {
        toggleWorksPanel();
        worksToggleBtn.focus();
      }
    });

    function renderWorksTable() {
      const query = norm(worksSearchInput.value);
      const filtered = window.WORLD_FAMOUS_LITERATURE.filter(item => {
        if (!query) return true;
        return norm(item.title).includes(query) ||
               norm(item.author).includes(query) ||
               norm(item.nationality).includes(query);
      });

      worksTableBody.innerHTML = '';
      worksCount.textContent = `تعداد نمایش: ${filtered.length.toLocaleString('fa-IR')}`;

      if (filtered.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="4" style="text-align:center; padding: 1.5rem; color: var(--text-muted);">اثری با این مشخصات یافت نشد.</td>`;
        worksTableBody.appendChild(tr);
        return;
      }

      const frag = document.createDocumentFragment();
      filtered.forEach((item, index) => {
        const tr = document.createElement('tr');

        const tdIdx = document.createElement('td');
        tdIdx.className = 'col-idx';
        tdIdx.textContent = (index + 1).toLocaleString('fa-IR');

        const tdTitle = document.createElement('td');
        tdTitle.className = 'col-title';
        tdTitle.textContent = item.title;

        const tdAuthor = document.createElement('td');
        tdAuthor.className = 'col-author';
        tdAuthor.textContent = item.author;

        const tdNat = document.createElement('td');
        tdNat.className = 'col-nationality';
        tdNat.textContent = item.nationality;

        tr.appendChild(tdIdx);
        tr.appendChild(tdTitle);
        tr.appendChild(tdAuthor);
        tr.appendChild(tdNat);
        frag.appendChild(tr);
      });

      worksTableBody.appendChild(frag);
    }

    worksSearchInput.addEventListener('input', renderWorksTable);
  </script>
</body>
</html>
