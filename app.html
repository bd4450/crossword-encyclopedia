<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دانشیار - دانشنامه و حل جدول متقاطع</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body { font-family: Tahoma, 'Vazirmatn', sans-serif; background-color: var(--bg); margin: 0; padding: 12px; color: var(--text); line-height: 1.5; }
    .container { max-width: 680px; margin: 0 auto; background: var(--card-bg); padding: 18px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { text-align: center; font-size: 20px; margin: 0 0 12px 0; color: #0f172a; }
    .status-badge { display: flex; align-items: center; justify-content: center; font-size: 13px; margin-bottom: 15px; padding: 6px 14px; border-radius: 20px; background-color: #dcfce7; color: var(--success); }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background-color: currentColor; margin-left: 8px; }
    .search-box { display: flex; gap: 8px; }
    .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
    input { width: 100%; padding: 12px 36px 12px 12px; font-size: 15px; border: 2px solid var(--border); border-radius: 10px; outline: none; transition: border-color .2s; font-family: inherit; }
    input:focus { border-color: var(--primary); }
    .clear-btn { position: absolute; left: 10px; background: none; border: none; font-size: 20px; color: #94a3b8; cursor: pointer; display: none; line-height: 1; }
    .btn-search { padding: 0 20px; background-color: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; font-family: inherit; cursor: pointer; transition: background .2s; }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px 0; margin-bottom: 8px; }
    .filter-chip { font-size: 12px; padding: 4px 10px; border-radius: 14px; background: #f1f5f9; color: var(--text-muted); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
    .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .section-title { margin: 20px 0 10px; font-size: 15px; color: #0f172a; font-weight: bold; border-bottom: 2px solid var(--border); padding-bottom: 6px; }
    .card { background: #f8fafc; border-right: 4px solid var(--primary); padding: 12px; margin-bottom: 8px; border-radius: 6px; }
    .card-header { font-size: 16px; font-weight: bold; color: #0f172a; }
    .clue { font-size: 13.5px; color: #475569; margin-top: 5px; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .empty { text-align: center; color: var(--text-muted); padding: 18px; font-size: 13px; }
    mark { background-color: #fde047; color: #854d0e; padding: 0 3px; border-radius: 2px; }
  </style>
</head>
<body>
<div class="container">
  <h1>دانشیار - دانشنامه و حل جدول</h1>
  <div class="status-badge"><span class="status-dot"></span> <span id="statusText">در حال بارگذاری...</span></div>
  <div class="search-box">
    <div class="input-wrapper">
      <input type="text" id="searchInput" placeholder="جستجوی واژه..." autocomplete="off">
      <button id="clearBtn" class="clear-btn" onclick="clearInput()">&times;</button>
    </div>
    <button class="btn-search" onclick="doSearch()">جستجو</button>
  </div>
  <div class="filters">
    <button class="filter-chip active" onclick="setFilter('all', this)">همه</button>
    <button class="filter-chip" onclick="setFilter('ادبیات', this)">ادبیات</button>
    <button class="filter-chip" onclick="setFilter('جغرافیا', this)">جغرافیا</button>
    <button class="filter-chip" onclick="setFilter('تاریخ', this)">تاریخ</button>
    <button class="filter-chip" onclick="setFilter('پزشکی', this)">پزشکی و سلامت</button>
  </div>
  <div id="results"></div>
</div>

<script src="data1.js"></script>
<script src="data_g.js"></script>
<script src="data_h.js"></script>
<script src="data_m.js"></script>

<script>
  let currentCategory = 'all';
  function setFilter(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    if (document.getElementById("searchInput").value.trim()) doSearch();
  }

  function getDataSource() {
    return [...(window.CROSSWORD_DATA||[]), ...(window.GEO_DATA||[]), ...(window.HISTORY_DATA||[]), ...(window.MED_DATA||[])];
  }

  function initApp() {
    document.getElementById("statusText").innerText = "بانک داده متصل است (" + getDataSource().length.toLocaleString("fa-IR") + " مورد)";
    document.getElementById("searchInput").addEventListener("input", function() { document.getElementById("clearBtn").style.display = this.value ? "block" : "none"; });
  }
  
  function clearInput() { const input = document.getElementById("searchInput"); input.value = ""; document.getElementById("clearBtn").style.display = "none"; input.focus(); }
  
  function normalizeText(t) { return (t||"").toString().replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/ة/g, "ه").replace(/[؟?!.،,:;'"“”‘’(){}\[\]]/g, " ").replace(/\s+/g, " ").trim().toLowerCase(); }

  function doSearch() {
    const rawQuery = document.getElementById("searchInput").value.trim();
    if (!rawQuery) return;
    const queryNorm = normalizeText(rawQuery);
    const data = getDataSource();
    const results = data.filter(item => {
      const matchCat = (currentCategory === 'all' || (item.cat||"").includes(currentCategory));
      const matchText = normalizeText(item.a).includes(queryNorm) || normalizeText(item.c).includes(queryNorm);
      return matchCat && matchText;
    });
    
    const container = document.getElementById("results");
    if (!results.length) { container.innerHTML = '<div class="empty">موردی یافت نشد.</div>'; return; }
    
    let html = `<div class="section-title">نتایج (${results.length.toLocaleString("fa-IR")} مورد)</div>`;
    results.slice(0, 30).forEach(item => {
      html += `<div class="card"><div class="card-header">${item.a}</div><div class="clue">${item.c}</div></div>`;
    });
    container.innerHTML = html;
  }
  
  window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
