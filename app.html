<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دانشیار - بانک جامع دانش</title>
  <style>
    :root { --primary: #7c3aed; --bg: #f8fafc; --green: #16a34a; }
    body { font-family: Tahoma, sans-serif; background-color: var(--bg); padding: 15px; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: var(--primary); margin: 0 0 10px; }

    .filters { display: flex; gap: 5px; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #eee; }
    .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; cursor: pointer; white-space: nowrap; font-size: 14px; transition: 0.3s; background: #fff; }
    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .search-btn{
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .search-btn:active{ opacity: .9; }

    .card { padding: 15px; border-bottom: 1px solid #eee; }
    .ans { font-weight: bold; color: var(--primary); font-size: 1.1em; margin-bottom: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h1>دانشیار</h1>

  <div class="filters">
    <button class="filter-chip active" onclick="setFilter('all', this)">همه</button>
    <button class="filter-chip" onclick="setFilter('ادبیات', this)">ادبیات</button>
    <button class="filter-chip" onclick="setFilter('جغرافیا', this)">جغرافیا</button>
    <button class="filter-chip" onclick="setFilter('تاریخ', this)">تاریخ</button>
    <button class="filter-chip" onclick="setFilter('پزشکی', this)">پزشکی</button>
    <button class="filter-chip" onclick="setFilter('هنر', this)">هنر</button>
  </div>

  <input
    type="text"
    id="searchInput"
    placeholder="جستجو در دانش‌نامه..."
    onkeydown="if(event.key==='Enter'){ doSearch(); }"
  >

  <!-- ۱) دکمه جستجوی سبز (مستقل) -->
  <button class="search-btn" onclick="doSearch()">جستجو</button>

  <div id="results"></div>
</div>

<!-- فایل‌های دیتا -->
<script src="data1.js"></script>
<script src="data_g.js"></script>
<script src="data_h.js"></script>
<script src="data_m.js"></script>
<script src="data_a.js"></script>
<script src="data_sp.js"></script>

<script>
  let currentCategory = 'all';

  function setFilter(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    doSearch();
  }

  function getDataSource() {
    // ادغام تمام آرایه‌ها از فایل‌های مختلف
    // نکته: اگر بعضی فایل‌ها هنوز ساخته نشده باشند، با || [] خطا نمی‌دهد
    return [
      ...(window.CROSSWORD_DATA || []),
      ...(window.GEO_DATA || []),
      ...(window.HISTORY_DATA || []),
      ...(window.MED_DATA || []),
      ...(window.ART_DATA || []),
      ...(window.CROSSWORD_DATA_SP || []) // اگر در data_sp.js جدا تعریف کرده باشید
    ];
  }

  function safeLower(x){
    return (x==null ? "" : String(x)).toLowerCase();
  }

  function doSearch() {
    const q = safeLower(document.getElementById("searchInput").value.trim());
    const data = getDataSource();

    const results = data.filter(item => {
      const a = safeLower(item.a);
      const c = safeLower(item.c);

      // دسته‌بندی: یا item.cat داشته باشد، یا داخل متن سرنخ/پاسخ نام دسته آمده باشد
      // (چون بعضی دیتاهای شما ممکن است cat نداشته باشند)
      const catText = safeLower(item.cat || "");
      const matchCat = (
        currentCategory === 'all' ||
        catText.includes(safeLower(currentCategory)) ||
        c.includes(safeLower(currentCategory))
      );

      const matchText = (!q || a.includes(q) || c.includes(q));
      return matchCat && matchText;
    });

    const container = document.getElementById("results");
    container.innerHTML = results.map(item => `
      <div class="card">
        <div class="ans">${item.a ?? ""}</div>
        <div>${item.c ?? ""}</div>
      </div>
    `).join('');
  }

  // نمایش اولیه همه داده‌ها
  doSearch();
</script>

</body>
</html>
