<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دانشیار - بانک جامع دانش</title>

    .filters { display: flex; gap: 5px; overflow-x: auto; padding: 10px 0; }

    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
    .card { padding: 10px; border-bottom: 1px solid #eee; }
    .ans { font-weight: bold; color: var(--primary); }

</head>

    <button class="filter-chip" onclick="setFilter('ادبیات', this)">ادبیات</button>
    <button class="filter-chip" onclick="setFilter('جغرافیا', this)">جغرافیا</button>
    <button class="filter-chip" onclick="setFilter('تاریخ', this)">تاریخ</button>

  <input type="text" id="searchInput" placeholder="جستجو..." oninput="doSearch()">
  <div id="results"></div>
</div>
